# .github/workflows/ci.yml
# GitHub Actions workflow - runs automatically on every push/PR
# This checks our code style and runs all the tests
# Took me a while to figure out how this works but it's pretty cool

name: CI - PlayMaker Pro

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"  # runs on any feature branch too
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Code style check with flake8
  # ─────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8==7.0.0

      - name: Run flake8
        run: |
          # Stop if there are syntax errors or undefined names
          # E501 = line too long (we allow up to 88 chars like black does)
          flake8 . \
            --exclude=venv,.git,__pycache__ \
            --max-line-length=88 \
            --count \
            --statistics

  # ─────────────────────────────────────────────
  # JOB 2: Run all tests + coverage report
  # ─────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint  # only runs if lint passes first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=80 \
            --tb=short

      - name: Upload HTML coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()  # upload even if tests fail, so we can see what's wrong
        with:
          name: coverage-report-html
          path: htmlcov/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Performance test (NF1 requirement)
  # Checks that 10K records process in < 3 seconds
  # ─────────────────────────────────────────────
  performance:
    name: Performance Test (NF1)
    runs-on: ubuntu-latest
    needs: test  # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run performance test only
        run: |
          pytest tests/test_performance.py -v --tb=short
